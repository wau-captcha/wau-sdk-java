name: ci

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The SDK supports Java 17 and later.
        java: [17, 21]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # The wrapper is committed without its executable bit.
      - run: chmod +x mvnw
      - run: ./mvnw -B verify
